[daily_update]
# 每日更新配置

# 是否启用每日更新
enabled = true

# 更新时间设置（24小时制）
# 开盘后快速更新时间
market_open_time = 09:30

# 午间更新时间  
noon_update_time = 12:00

# 收盘后完整更新时间
market_close_time = 15:10

# 晚间补充更新时间
evening_update_time = 18:00

# 数据更新设置
# 每日K线更新的股票数量限制（0表示不限制）
daily_kline_limit = 200

# 实时行情批量处理大小
market_batch_size = 100

# 请求延迟（秒）
request_delay = 0.1

# 重试次数
retry_times = 3

# 日志设置
# 是否保存详细日志
detailed_logging = true

# 日志保留天数
log_retention_days = 30

# 通知设置
# 是否启用更新完成通知
enable_notification = false

# 错误通知阈值（错误数量超过此值时发送通知）
error_threshold = 5

[schedule_settings]
# 调度器设置

# 是否在非交易日跳过更新
skip_non_trading_days = true

# 是否在启动时立即执行一次更新
run_on_startup = true

# 调度器检查间隔（秒）
check_interval = 60 