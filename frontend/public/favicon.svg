<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ibBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7DFF"/>
      <stop offset="0.55" stop-color="#185FA5"/>
      <stop offset="1" stop-color="#0A3D77"/>
    </linearGradient>
    <linearGradient id="ibGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ibBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C6DEFB"/>
    </linearGradient>
  </defs>

  <!-- 圆角底 + 顶部玻璃反光 + 内描边 -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#ibBg)"/>
  <path d="M2 17a15 15 0 0 1 15-15h30a15 15 0 0 1 15 15v6H2z" fill="url(#ibGloss)"/>
  <rect x="3" y="3" width="58" height="58" rx="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>

  <!-- 底部基座线 -->
  <path d="M8 48.5h48" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 三根白色数据柱（左低右高，逐级上升） -->
  <g fill="url(#ibBar)">
    <rect x="11.5" y="40" width="7.6" height="7.4" rx="1.6"/>
    <rect x="23.6" y="33.5" width="7.6" height="13.9" rx="1.6"/>
    <rect x="35.7" y="25" width="7.6" height="22.4" rx="1.6"/>
  </g>

  <!-- 金色上升趋势线贯穿柱顶，指向右上目标 -->
  <path d="M15.3 40.6 27.4 34 39.5 25.6 53.6 12.4"
        fill="none" stroke="#D4AF37" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 目标信号点：实心 + 外扩环 -->
  <circle cx="53.6" cy="12.4" r="3.4" fill="#E9C76A"/>
  <circle cx="53.6" cy="12.4" r="6" fill="none" stroke="#E9C76A" stroke-opacity="0.5" stroke-width="1.4"/>
</svg>
